name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup.ps1 parses (Windows PowerShell 5.1 and PowerShell 7)
        shell: pwsh
        run: |
          $code = 'foreach ($f in "setup.ps1") { $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { "{0}:{1} {2}" -f $f, $_.Extent.StartLineNumber, $_.Message }; exit 1 } }'
          powershell -NoProfile -Command $code; if ($LASTEXITCODE) { exit 1 }
          pwsh -NoProfile -Command $code; if ($LASTEXITCODE) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          # Write-Host is the script's console output; the rest are real findings.
          $found = Invoke-ScriptAnalyzer -Path setup.ps1 -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSUseShouldProcessForStateChangingFunctions
          $found | Format-Table -AutoSize | Out-String -Width 200
          if ($found | Where-Object Severity -in "Error", "Warning") { exit 1 }

      - name: keys.json add/remove (Windows PowerShell 5.1 and PowerShell 7)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/keys.ps1; if ($LASTEXITCODE) { exit 1 }
          pwsh -NoProfile -File tests/keys.ps1; if ($LASTEXITCODE) { exit 1 }

      - name: JSON files parse
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Recurse -Include *.json -File) {
            try { $null = Get-Content $f.FullName -Raw | ConvertFrom-Json } catch { "$($_.Exception.Message) in $($f.FullName)"; exit 1 }
          }

      - name: Mods are valid JavaScript modules
        shell: pwsh
        run: |
          foreach ($js in Get-ChildItem mods -Recurse -Filter main.js) {
            $tmp = Join-Path $env:RUNNER_TEMP "$($js.Directory.Name).mjs"
            Copy-Item $js.FullName $tmp
            node --check $tmp; if ($LASTEXITCODE) { "syntax error in $js"; exit 1 }
          }
